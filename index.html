<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Ardoise de calcul mental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout : trois écrans plein cadre (Accueil → Partie → Résultat), une seule décision par zone, gros boutons au pouce */
:root {
  --bg: #eaf1f7;
  --surface: #ffffff;
  --ink: #18263a;
  --muted: #5a6b82;
  --line: #d2dde9;
  --slate: #1f4d45;
  --chalk: #f4fbf8;
  --chalk-dim: #9fc6b8;
  --accent: #ff7a1a;
  --accent-ink: #ffffff;
  --add: #2f80ed;
  --sub: #8e44d6;
  --mul: #e0442b;
  --mix: #12a17a;
  --good: #1e9e5a;
  --bad: #d6363c;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1620; --surface: #1a2532; --ink: #eaf0f6; --muted: #9db0c5; --line: #2d3c4e;
    --slate: #163a33; --chalk: #f0faf6; --chalk-dim: #7fae9e;
    --accent: #ff8f3d; --accent-ink: #1b1006;
    --add: #5a9cf5; --sub: #ac72ea; --mul: #f0664f; --mix: #2fc496;
    --good: #35c27a; --bad: #ff5c63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1620; --surface: #1a2532; --ink: #eaf0f6; --muted: #9db0c5; --line: #2d3c4e;
  --slate: #163a33; --chalk: #f0faf6; --chalk-dim: #7fae9e;
  --accent: #ff8f3d; --accent-ink: #1b1006;
  --add: #5a9cf5; --sub: #ac72ea; --mul: #f0664f; --mix: #2fc496;
  --good: #35c27a; --bad: #ff5c63;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: clip;
}
.screen > * { min-width: 0; max-width: 100%; }
.equation > span { min-width: 0; }
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; user-select: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.screen { max-width: 560px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* ---------- Accueil ---------- */
.home h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.4rem); line-height: 1.05; margin: 4px 0 0; text-wrap: balance; }
.home .sub { margin: 0; color: var(--muted); font-weight: 700; }
.step { display: grid; gap: 8px; }
.step-title { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 0; }
.ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.op {
  --c: var(--add);
  background: var(--surface); border: 3px solid var(--line); border-radius: 18px;
  padding: 12px 10px; display: flex; align-items: center; gap: 12px; text-align: left;
}
.op .sym {
  flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: #fff; font: 800 2rem/1 var(--font-display);
}
.op .name { font-weight: 800; font-size: 1.05rem; line-height: 1.15; min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.op[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 4px; gap: 4px; }
.seg button { min-width: 0; overflow-wrap: anywhere; background: transparent; border: 0; border-radius: 12px; padding: 10px 4px; font-weight: 800; font-size: .98rem; line-height: 1.15; }
.seg button small { display: block; font-weight: 700; font-size: .75rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .8; }
.example { margin: 0; color: var(--muted); font-weight: 700; font-size: .92rem; min-height: 1.3em; }
.example b { color: var(--ink); font-family: var(--font-display); font-size: 1.05rem; }
.play {
  margin-top: auto; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 20px;
  padding: 16px; font: 800 1.5rem var(--font-display);
  box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 60%, #000 40%);
}
.play:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000 40%); }

/* ---------- Partie ---------- */
.topbar { display: flex; align-items: center; gap: 12px; }
.back { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-size: 1.3rem; font-weight: 800; display: grid; place-items: center; }
.progress { flex: 1; min-width: 0; height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s; }
.count { flex: none; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.timer { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font: 800 1.15rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.timer svg { width: 18px; height: 18px; }
.timer.warn { border-color: var(--accent); color: var(--accent); }
.timer.danger { border-color: var(--bad); color: #fff; background: var(--bad); }
.timeup { margin: 0; font-weight: 800; color: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .timer.danger { animation: beat 1s ease-in-out infinite; } @keyframes beat { 50% { transform: scale(1.08); } } }

.board {
  background: var(--slate); color: var(--chalk); border-radius: 22px;
  padding: 18px 14px 14px; display: grid; gap: 6px; text-align: center;
  box-shadow: inset 0 0 0 6px color-mix(in srgb, var(--slate) 65%, #000 35%);
}
.board-label { font-weight: 800; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); }
.equation {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 13vw, 4.4rem); line-height: 1.15;
  display: flex; justify-content: center; align-items: center; gap: .25em; flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}
.hole { min-width: 1.6em; padding: 0 .15em; border-bottom: 5px dashed var(--accent); color: var(--accent); }
.hole.ok { color: #7fe3a9; border-bottom: 5px solid #7fe3a9; }
.hole.ko { color: #ffb2b5; border-bottom-color: #ffb2b5; }
.feedback { min-height: 1.6em; font-weight: 800; font-size: 1.15rem; }
.feedback.ok { color: #7fe3a9; }
.feedback.ko { color: #ffd0d2; }

.prompt { margin: 0; text-align: center; font-weight: 800; color: var(--muted); }
.choices { display: flex; justify-content: center; gap: 12px; }
.choice {
  flex: 0 1 auto; width: min(19vw, 84px); aspect-ratio: 1; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--line);
  box-shadow: 0 6px 0 var(--line);
  font: 800 clamp(1.2rem, 6vw, 1.9rem)/1 var(--font-display); font-variant-numeric: tabular-nums; border-width: 3px; box-shadow: 0 4px 0 var(--line);
  display: grid; place-items: center; transition: transform .08s;
}
.choice:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
.choice:disabled { cursor: default; }
.choice.right { background: var(--good); border-color: var(--good); color: #fff; box-shadow: 0 6px 0 color-mix(in srgb, var(--good) 60%, #000 40%); }
.choice.wrong { background: var(--bad); border-color: var(--bad); color: #fff; box-shadow: 0 6px 0 color-mix(in srgb, var(--bad) 60%, #000 40%); }
.choice.dim { opacity: .35; }
@media (min-width: 620px) {
  .choices { gap: 16px; }
}

/* ---------- Résultat ---------- */
.result { text-align: center; align-items: center; }
.stars { font-size: 3rem; letter-spacing: .1em; line-height: 1; margin-top: 12px; }
.stars span { color: var(--line); }
.stars span.on { color: #f5b301; }
.result h2 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; margin: 0; text-wrap: balance; }
.score { font: 800 3.4rem/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.review { width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; text-align: left; display: grid; gap: 8px; }
.review h3 { margin: 0; font-size: 1rem; }
.review ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.review li { font: 700 1.25rem var(--font-display); font-variant-numeric: tabular-nums; }
.review li b { color: var(--good); }
.review li s { color: var(--bad); font-size: .95rem; margin-left: 6px; }

/* ---------- Explication bande numérique ---------- */
.review li { display: grid; gap: 6px; }
.explain { font: 600 1rem/1.45 var(--font-body); border-top: 1px dashed var(--line); padding-top: 6px; }
.explain summary { cursor: pointer; font-weight: 800; color: var(--accent); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; }
.explain summary::-webkit-details-marker { display: none; }
.explain summary::before { content: "▸"; transition: transform .15s; }
.explain[open] summary::before { transform: rotate(90deg); }
.explain-body { display: grid; gap: 10px; padding-top: 6px; }
.explain-intro { margin: 0; }
.nl { width: 100%; height: auto; display: block; overflow: visible; }
.nl .axis { stroke: var(--ink); stroke-width: 2; }
.nl .tick { stroke: var(--muted); stroke-width: 1.5; }
.nl .tick.small { stroke: var(--line); }
.nl .tlabel { fill: var(--muted); font: 700 13px var(--font-body); }
.nl .pt { stroke: var(--surface); stroke-width: 2; }
.nl .pt.start { fill: var(--add); }
.nl .pt.mid { fill: var(--muted); }
.nl .pt.end { fill: var(--good); }
.nl .plabel { font: 800 15px var(--font-display); fill: var(--ink); }
.nl .plabel.start { fill: var(--add); }
.nl .plabel.end { fill: var(--good); }
.nl .jump { transition: opacity .25s; }
.nl .jump path { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.nl .jump .head { fill: var(--accent); stroke: none; }
.nl .jump text { font: 800 14px var(--font-display); fill: var(--accent); }
.nl.playing .jump { opacity: .25; }
.nl.playing .jump.on { opacity: 1; }
.nl.playing .jump.on path { stroke-width: 4; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.steps li { font: 600 1rem/1.4 var(--font-body); display: list-item; transition: background .2s; border-radius: 6px; padding: 1px 4px; }
.steps li.on { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.explain-total { margin: 0; font-weight: 800; }
.explain-total.on { background: color-mix(in srgb, var(--good) 20%, transparent); border-radius: 6px; }
.listen { justify-self: start; display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 14px; font: 800 .95rem var(--font-body); }
.listen svg { width: 16px; height: 16px; }
.actions { width: 100%; display: grid; gap: 10px; margin-top: auto; }
.ghost { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px; font: 800 1.15rem var(--font-display); }

/* ---------- Coupe (10/10) ---------- */
.trophy { width: min(46vw, 190px); margin-top: 8px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.25)); }
.trophy-tag { margin: -4px 0 0; font: 800 1.1rem var(--font-display); color: #c98a00; letter-spacing: .04em; text-transform: uppercase; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (prefers-reduced-motion: no-preference) {
  .trophy.in { animation: trophyIn .9s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes trophyIn { 0% { transform: scale(0) rotate(-25deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .trophy .shine { animation: shine 2.4s ease-in-out .9s infinite; }
  @keyframes shine { 0%, 60% { transform: translateX(-120px); } 100% { transform: translateX(160px); } }
  .pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.9); opacity: .3; } to { transform: none; opacity: 1; } }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
}
@media (max-width: 420px) {
  body { padding-block: 12px; }
  .screen { gap: 14px; }
  .op { flex-direction: column; text-align: center; gap: 6px; padding: 10px 6px; }
  .op .sym { width: 42px; height: 42px; font-size: 1.7rem; }
  .op .name { font-size: .98rem; }
  .seg button { font-size: .9rem; padding: 8px 2px; }
  .seg button small { font-size: .7rem; }
  .topbar { gap: 8px; }
  .back { width: 40px; height: 40px; }
  .timer { padding: 5px 9px; font-size: 1rem; }
  .timer svg { width: 15px; height: 15px; }
  .board { padding: 14px 10px 10px; }
  .equation { font-size: clamp(2rem, 11vw, 3rem); }
  .choices { gap: 8px; }
  .stars { font-size: 2.4rem; }
  .score { font-size: 2.8rem; }
}
</style>
</head>
<body>

<!-- ============ ÉCRAN 1 : ACCUEIL ============ -->
<section class="screen home" id="home">
  <div>
    <h1>Ardoise de calcul mental</h1>
    <p class="sub">10 calculs contre la montre, 4 réponses au choix.</p>
  </div>

  <div class="step">
    <h2 class="step-title">1. Quelle opération ?</h2>
    <div class="ops" id="ops">
      <button class="op" style="--c:var(--add)" data-v="add" aria-pressed="true"><span class="sym">+</span><span class="name">Addition</span></button>
      <button class="op" style="--c:var(--sub)" data-v="sub" aria-pressed="false"><span class="sym">−</span><span class="name">Soustraction</span></button>
      <button class="op" style="--c:var(--mul)" data-v="mul" aria-pressed="false"><span class="sym">×</span><span class="name">Multiplication</span></button>
      <button class="op" style="--c:var(--mix)" data-v="mix" aria-pressed="false"><span class="sym">?</span><span class="name">Un peu de tout</span></button>
    </div>
  </div>

  <div class="step">
    <h2 class="step-title">2. Quel type de calcul ?</h2>
    <div class="seg" id="types">
      <button data-v="simple" aria-pressed="true">Simple<small>trouver le résultat</small></button>
      <button data-v="trou" aria-pressed="false">À trous<small>trouver le nombre caché</small></button>
      <button data-v="mix" aria-pressed="false">Les deux<small>mélangés</small></button>
    </div>
    <p class="example" id="example"></p>
  </div>

  <div class="step">
    <h2 class="step-title">3. Quel niveau ?</h2>
    <div class="seg" id="levels">
      <button data-v="1" aria-pressed="true">Facile<small id="lv1"></small></button>
      <button data-v="2" aria-pressed="false">Moyen<small id="lv2"></small></button>
      <button data-v="3" aria-pressed="false">Difficile<small id="lv3"></small></button>
    </div>
  </div>

  <button class="play" id="play">Jouer</button>
</section>

<!-- ============ ÉCRAN 2 : PARTIE ============ -->
<section class="screen" id="game" hidden>
  <div class="topbar">
    <button class="back" id="quit" aria-label="Revenir au menu">←</button>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <span class="count" id="count">1/10</span>
    <button class="back" id="sound" aria-label="Couper le son" aria-pressed="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mute" d="M17 9l5 6M22 9l-5 6" style="display:none"/></svg></button>
    <span class="timer" id="timer" aria-label="Temps restant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="time">3:00</span></span>
  </div>

  <div class="board">
    <div class="board-label" id="label">Calcule</div>
    <div class="equation pop" id="equation" aria-live="polite"></div>
    <div class="feedback" id="feedback" aria-live="assertive"></div>
  </div>

  <p class="prompt" id="prompt">Touche la bonne réponse</p>
  <div class="choices" id="choices"></div>
</section>

<!-- ============ ÉCRAN 3 : RÉSULTAT ============ -->
<section class="screen result" id="result" hidden>
  <svg class="trophy" id="trophy" viewBox="0 0 120 140" role="img" aria-label="Coupe du champion" hidden>
    <defs>
      <linearGradient id="gold" x1="0" x2="1">
        <stop offset="0" stop-color="#e9a400"/><stop offset=".45" stop-color="#ffe066"/><stop offset="1" stop-color="#d48f00"/>
      </linearGradient>
      <clipPath id="cupClip"><path d="M24 10h72v24c0 22-15 38-36 38S24 56 24 34z"/></clipPath>
    </defs>
    <path d="M24 18H10v8c0 14 9 24 22 25M96 18h14v8c0 14-9 24-22 25" fill="none" stroke="#d48f00" stroke-width="7" stroke-linecap="round"/>
    <path d="M24 10h72v24c0 22-15 38-36 38S24 56 24 34z" fill="url(#gold)"/>
    <g clip-path="url(#cupClip)"><rect class="shine" x="10" y="0" width="16" height="90" fill="#fff" opacity=".45" transform="translate(-120 0)"/></g>
    <rect x="52" y="70" width="16" height="20" fill="#d48f00"/>
    <path d="M36 90h48l6 16H30z" fill="url(#gold)"/>
    <rect x="24" y="106" width="72" height="16" rx="3" fill="#7a4b1e"/>
    <rect x="40" y="110" width="40" height="8" rx="2" fill="#ffe066"/>
    <text x="60" y="44" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#9a6400">10</text>
  </svg>
  <p class="trophy-tag" id="trophy-tag" hidden>Champion du calcul</p>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <h2 id="r-title">Bravo !</h2>
  <p class="timeup" id="timeup" hidden></p>
  <div class="score" id="r-score">0 / 10</div>
  <div class="review" id="review" hidden>
    <h3>Les calculs à revoir</h3>
    <ul id="review-list"></ul>
  </div>
  <div class="actions">
    <button class="play" id="again">Rejouer</button>
    <button class="ghost" id="menu">Changer de jeu</button>
  </div>
</section>

<script>
(() => {
  const N = 10;
  const $ = (id) => document.getElementById(id);
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const SIGN = { add: "+", sub: "−", mul: "×" };
  const S = { op: "add", type: "simple", level: 1, qs: [], i: 0, locked: false };

  const LEVEL_HINT = {
    add: ["jusqu'à 10", "jusqu'à 20, parfois 100", "jusqu'à 100"],
    sub: ["jusqu'à 10", "jusqu'à 20, parfois 100", "jusqu'à 100"],
    mul: ["tables 1 à 5", "tables 2 à 10", "tables 2 à 12"],
    mix: ["petits nombres", "nombres moyens", "grands nombres"],
  };

  /* ---------- génération ---------- */
  function makeQuestion() {
    const op = S.op === "mix" ? pick(["add", "sub", "mul"]) : S.op;
    const type = S.type === "mix" ? pick(["simple", "trou"]) : S.type;
    const L = S.level;
    let a, b, c;
    if (op === "add") {
      const max = L === 2 && Math.random() < .3 ? 100 : [10, 20, 100][L - 1];
      c = rnd(L === 1 ? 3 : 8, max); a = rnd(1, c - 1); b = c - a;
    } else if (op === "sub") {
      const max = L === 2 && Math.random() < .3 ? 100 : [10, 20, 100][L - 1];
      a = rnd(L === 1 ? 3 : 8, max); b = rnd(1, a - 1); c = a - b;
    } else {
      const [lo, hi] = [[1, 5], [2, 10], [2, 12]][L - 1];
      a = rnd(lo, hi); b = rnd(L === 1 ? 1 : 2, 10); c = a * b;
      if (Math.random() < .5) [a, b] = [b, a];
    }
    const hole = type === "simple" ? 2 : pick([0, 1]);
    const answer = [a, b, c][hole];
    return { op, nums: [a, b, c], hole, answer, given: null, choices: makeChoices(answer, op, hole, a, b) };
  }

  function makeChoices(answer, op, hole, a, b) {
    const set = new Set([answer]);
    const near = shuffle([answer + 1, answer - 1, answer + 2, answer - 2]);
    const traps = [];
    if (op === "mul" && hole === 2) traps.push(a * (b + 1), a * (b - 1), a + b);
    if (op === "mul" && hole !== 2) traps.push(answer + 1, answer - 1);
    if (op === "sub" && hole === 2) traps.push(a + b);
    if (op === "add" && hole === 2) traps.push(Math.abs(a - b));
    if (answer >= 10) traps.push(answer + 10, answer - 10);
    for (const v of [...shuffle(traps), ...near]) {
      if (set.size >= 4) break;
      if (v >= 0) set.add(v);
    }
    let k = 3; while (set.size < 4) set.add(answer + k++);
    return shuffle([...set]);
  }

  /* ---------- écrans ---------- */
  function show(id) {
    for (const s of ["home", "game", "result"]) $(s).hidden = s !== id;
    window.scrollTo(0, 0);
  }

  function renderHome() {
    const lv = LEVEL_HINT[S.op];
    $("lv1").textContent = lv[0] + " · 2 min"; $("lv2").textContent = lv[1] + " · 3 min"; $("lv3").textContent = lv[2] + " · 3 min";
    const ex = { simple: "<b>4 + 3 = ?</b>", trou: "<b>4 + ? = 7</b>", mix: "<b>4 + 3 = ?</b> et <b>4 + ? = 7</b>" }[S.type];
    $("example").innerHTML = "Exemple : " + ex;
  }

  function bindSeg(id, key) {
    $(id).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      S[key] = key === "level" ? Number(b.dataset.v) : b.dataset.v;
      renderHome();
    });
  }
  bindSeg("ops", "op"); bindSeg("types", "type"); bindSeg("levels", "level");

  /* ---------- partie ---------- */
  function start() {
    S.qs = Array.from({ length: N }, makeQuestion);
    S.i = 0; S.locked = false; S.timeUp = false;
    stopExplain();
    unlockAudio();
    stopFx();
    show("game"); renderQuestion(true);
    startClock();
  }

  /* ---------- sons ---------- */
  let actx = null; S.sound = true;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) { actx = null; }
    try { if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
  }
  function tone(freq, start, dur, type = "sine", vol = .25) {
    if (!actx || !S.sound) return;
    const t = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .05);
  }
  const sndRight = () => { tone(660, 0, .15, "triangle"); tone(990, .1, .25, "triangle"); };
  const sndWrong = () => { tone(220, 0, .18, "square", .12); tone(165, .16, .3, "square", .12); };
  const sndFanfare = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, k * .14, k === 3 ? .6 : .2, "triangle", .22));
  function sayGenial() {
    if (!S.sound || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("Génial !");
      u.lang = "fr-FR"; u.rate = .95; u.pitch = 1.25;
      const v = speechSynthesis.getVoices().find(x => /^fr/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  $("sound").addEventListener("click", () => {
    S.sound = !S.sound;
    $("sound").setAttribute("aria-pressed", String(S.sound));
    $("sound").setAttribute("aria-label", S.sound ? "Couper le son" : "Remettre le son");
    document.getElementById("waves").style.display = S.sound ? "" : "none";
    document.getElementById("mute").style.display = S.sound ? "none" : "inline";
    if (S.sound) unlockAudio();
  });

  /* ---------- chrono 3 minutes ---------- */
  const LIMITS = { 1: 120, 2: 180, 3: 180 };
  function startClock() {
    stopClock();
    S.end = performance.now() + LIMITS[S.level] * 1000; S.startedAt = performance.now();
    tick(); S.clock = setInterval(tick, 250);
  }
  function stopClock() { clearInterval(S.clock); }
  function tick() {
    const left = Math.max(0, Math.ceil((S.end - performance.now()) / 1000));
    $("time").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    $("timer").className = "timer" + (left <= 15 ? " danger" : left <= 45 ? " warn" : "");
    if (left === 0) {
      stopClock(); clearTimeout(S.timer);
      S.locked = true; S.timeUp = true;
      const fb = $("feedback"); fb.className = "feedback ko"; fb.textContent = "Temps écoulé !";
      setTimeout(() => { fb.textContent = ""; fb.className = "feedback"; S.locked = false; showResult(); }, 1400);
    }
  }

  function renderQuestion(animate) {
    const q = S.qs[S.i];
    $("count").textContent = `${S.i + 1}/${N}`;
    $("bar").style.width = `${(S.i / N) * 100}%`;
    $("label").textContent = q.hole === 2 ? "Calcule" : "Trouve le nombre caché";
    const parts = q.nums.map((n, k) => {
      if (k !== q.hole) return `<span>${n}</span>`;
      let cls = "hole", txt = "?";
      if (q.given !== null) { cls += q.given === q.answer ? " ok" : " ko"; txt = q.answer; }
      return `<span class="${cls}">${txt}</span>`;
    });
    const eq = $("equation");
    eq.innerHTML = `${parts[0]}<span>${SIGN[q.op]}</span>${parts[1]}<span>=</span>${parts[2]}`;
    if (animate) { eq.classList.remove("pop"); void eq.offsetWidth; eq.classList.add("pop"); }

    $("choices").innerHTML = q.choices.map(v => {
      let cls = "choice";
      if (q.given !== null) {
        if (v === q.answer) cls += " right";
        else if (v === q.given) cls += " wrong";
        else cls += " dim";
      }
      return `<button class="${cls}" data-v="${v}" ${q.given !== null ? "disabled" : ""}>${v}</button>`;
    }).join("");
  }

  function choose(v) {
    if (S.locked) return;
    S.locked = true;
    const q = S.qs[S.i];
    q.given = v;
    const ok = v === q.answer;
    ok ? sndRight() : sndWrong();
    const fb = $("feedback");
    fb.className = "feedback " + (ok ? "ok" : "ko");
    fb.textContent = ok ? pick(["Bravo !", "Exact !", "Super !", "Très bien !", "Bien joué !"]) : `La bonne réponse est ${q.answer}.`;
    renderQuestion(false);
    $("bar").style.width = `${((S.i + 1) / N) * 100}%`;
    if (!ok) { const eq = $("equation"); eq.classList.remove("shake"); void eq.offsetWidth; eq.classList.add("shake"); }
    S.timer = setTimeout(next, ok ? 1000 : 2200);
  }

  function next() {
    $("feedback").textContent = ""; $("feedback").className = "feedback";
    S.locked = false;
    if (S.i < N - 1) { S.i++; renderQuestion(true); }
    else showResult();
  }

  /* ---------- résultat ---------- */
  function showResult() {
    stopClock();
    const used = Math.round((performance.now() - S.startedAt) / 1000);
    $("timeup").hidden = false;
    $("timeup").style.color = S.timeUp ? "" : "var(--muted)";
    $("timeup").textContent = S.timeUp
      ? `Temps écoulé : ${S.qs.filter(q => q.given !== null).length} calculs faits sur ${N}.`
      : `Terminé en ${Math.floor(used / 60)} min ${String(used % 60).padStart(2, "0")} s.`;
    const good = S.qs.filter(q => q.given === q.answer).length;
    const stars = good === N ? 3 : good >= 7 ? 2 : good >= 4 ? 1 : 0;
    $("stars").innerHTML = [0, 1, 2].map(k => `<span class="${k < stars ? "on" : ""}">★</span>`).join("");
    $("r-title").textContent = ["On s'entraîne encore ?", "Pas mal, continue !", "Très bien !", "Parfait, sans faute !"][stars];
    $("r-score").textContent = `${good} / ${N}`;
    const errs = S.qs.filter(q => q.given !== q.answer);
    $("review").hidden = errs.length === 0;
    let idx = 0; EXPL.length = 0;
    $("review-list").innerHTML = errs.map(q => {
      const n = q.nums.map((v, k) => k === q.hole ? `<b>${v}</b>` : v);
      const line = `<div>${n[0]} ${SIGN[q.op]} ${n[1]} = ${n[2]}${q.given === null ? '<s style="text-decoration:none">pas eu le temps</s>' : `<s>${q.given}</s>`}</div>`;
      return `<li>${line}${explainHTML(q, idx++)}</li>`;
    }).join("");
    const perfect = good === N;
    $("trophy").hidden = !perfect; $("trophy-tag").hidden = !perfect;
    $("trophy").classList.remove("in");
    show("result");
    stopFx();
    if (perfect) {
      void $("trophy").getBoundingClientRect(); $("trophy").classList.add("in"); celebrate();
      sndFanfare(); setTimeout(sayGenial, 700);
    }
  }


  /* ---------- explications sur la bande numérique (à trous, + et −) ---------- */
  const EXPL = [];
  const plural = (k, w) => `${k} ${w}${k > 1 ? "s" : ""}`;

  function jumpsUp(s, t) {
    const out = [];
    if (Math.floor(s / 10) === Math.floor(t / 10) || s === t) { out.push({ from: s, to: t, kind: "units" }); return out; }
    if (s % 10 <= t % 10) {
      const u = t % 10 - s % 10;
      if (u > 0) out.push({ from: s, to: s + u, kind: "units" });
      out.push({ from: s + u, to: t, kind: "tens" });
    } else {
      const n = Math.ceil(s / 10) * 10, m = Math.floor(t / 10) * 10;
      out.push({ from: s, to: n, kind: "ten" });
      if (m > n) out.push({ from: n, to: m, kind: "tens" });
      if (t > m) out.push({ from: m, to: t, kind: "units" });
    }
    return out;
  }
  function jumpsDown(s, t) {
    const out = [];
    if (Math.floor(s / 10) === Math.floor(t / 10)) { out.push({ from: s, to: t, kind: "units" }); return out; }
    if (s % 10 >= t % 10) {
      const u = s % 10 - t % 10;
      if (u > 0) out.push({ from: s, to: s - u, kind: "units" });
      out.push({ from: s - u, to: t, kind: "tens" });
    } else {
      const n = Math.floor(s / 10) * 10, m = Math.ceil(t / 10) * 10;
      out.push({ from: s, to: n, kind: "ten" });
      if (n > m) out.push({ from: n, to: m, kind: "tens" });
      if (m > t) out.push({ from: m, to: t, kind: "units" });
    }
    return out;
  }
  function stepText(j, i, up) {
    const d = Math.abs(j.to - j.from), verb = up ? "avance" : "recule";
    if (j.kind === "ten") return `On est à ${j.from}. La dizaine ${up ? "la plus proche" : "juste en dessous"} est ${j.to} : on ${verb} de ${d}.`;
    const lead = i === 0 ? `On est à ${j.from}. On ${verb}` : `De ${j.from}, on ${verb}`;
    if (j.kind === "tens") return `${lead} de ${plural(d / 10, "dizaine")}, soit ${d} : on arrive à ${j.to}.`;
    return `${lead} de ${plural(d, "unité")} : on arrive à ${j.to}.`;
  }

  function buildExplanation(q) {
    const [a, b, c] = q.nums, ans = q.answer;
    let intro, jumps, up = true, total;
    if (q.op === "add" && q.hole === 1) {
      intro = `On cherche combien il faut ajouter à ${a} pour arriver à ${c}. On part de ${a} sur la bande et on avance jusqu'à ${c}.`;
      jumps = jumpsUp(a, c);
    } else if (q.op === "add") {
      intro = `? + ${b} = ${c}, c'est pareil que ${b} + ? = ${c}. On part de ${b} sur la bande et on avance jusqu'à ${c}.`;
      jumps = jumpsUp(b, c);
    } else if (q.hole === 1) {
      intro = `On cherche combien il faut enlever à ${a} pour arriver à ${c}. On part de ${a} sur la bande et on recule jusqu'à ${c}.`;
      jumps = jumpsDown(a, c); up = false;
    } else {
      intro = `On cherche le nombre de départ : en reculant de ${b}, on doit arriver à ${c}. Ce nombre est ${c} + ${b} = ${ans}. On vérifie sur la bande : on part de ${ans} et on recule de ${b}.`;
      jumps = jumpsDown(ans, c); up = false;
    }
    const sizes = jumps.map(j => Math.abs(j.to - j.from));
    if (q.op === "sub" && q.hole === 0) {
      total = `On arrive bien à ${c}. Le nombre caché est ${ans}, car ${ans} − ${b} = ${c}.`;
    } else {
      const sum = sizes.length > 1 ? `${sizes.join(" + ")} = ${ans}` : `${ans}`;
      total = `En tout, on a ${up ? "avancé" : "reculé"} de ${sum}. Le nombre caché est ${ans}.`;
    }
    return { intro, jumps, up, total, steps: jumps.map((j, i) => stepText(j, i, up)) };
  }

  function numberLine(ex) {
    const W = 420, P = 22, Y = 110;
    const vals = [ex.jumps[0].from, ...ex.jumps.map(j => j.to)];
    const lo = Math.min(...vals), hi = Math.max(...vals);
    let L = Math.floor(lo / 10) * 10, R = Math.ceil(hi / 10) * 10;
    if (R === L) R = L + 10;
    const x = v => P + (v - L) / (R - L) * (W - 2 * P);
    let g = `<line class="axis" x1="${P - 8}" y1="${Y}" x2="${W - P + 8}" y2="${Y}"/>`;
    const fine = R - L <= 20;
    for (let v = L; v <= R; v += fine ? 1 : 5) {
      const big = v % 10 === 0;
      g += `<line class="tick ${big ? "" : "small"}" x1="${x(v)}" y1="${Y - (big ? 8 : 5)}" x2="${x(v)}" y2="${Y + (big ? 8 : 5)}"/>`;
      if (big && !vals.includes(v)) g += `<text class="tlabel" x="${x(v)}" y="${Y + 26}" text-anchor="middle">${v}</text>`;
    }
    ex.jumps.forEach((j, i) => {
      const x1 = x(j.from), x2 = x(j.to), dx = Math.abs(x2 - x1);
      const h = Math.max(18, Math.min(70, dx * .55));
      const mx = (x1 + x2) / 2, cy = Y - 2 * h;
      const dir = x2 > x1 ? 1 : -1;
      const hx = x2 - dir * 0, hy = Y - 4;
      const d = Math.abs(j.to - j.from);
      g += `<g class="jump" data-i="${i}">
        <path d="M${x1} ${Y - 4} Q${mx} ${cy} ${x2 - dir * 2} ${Y - 6}"/>
        <path class="head" d="M${x2} ${Y - 3} L${x2 - dir * 10} ${Y - 9} L${x2 - dir * 3} ${Y - 15} z"/>
        <text x="${mx}" y="${Y - h - 8}" text-anchor="middle">${ex.up ? "+" : "−"}${d}</text>
      </g>`;
    });
    let prevX = -99, row = 0;
    vals.forEach((v, k) => {
      const cls = k === 0 ? "start" : k === vals.length - 1 ? "end" : "mid";
      g += `<circle class="pt ${cls}" cx="${x(v)}" cy="${Y}" r="${cls === "mid" ? 5 : 7}"/>`;
    });
    const order = vals.map((v, k) => ({ v, k })).sort((p, q) => p.v - q.v);
    order.forEach(({ v, k }) => {
      const cls = k === 0 ? "start" : k === vals.length - 1 ? "end" : "";
      const px = x(v);
      row = px - prevX < 24 ? (row + 1) % 2 : 0; prevX = px;
      g += `<text class="plabel ${cls}" x="${px}" y="${Y + 28 + row * 17}" text-anchor="middle">${v}</text>`;
    });
    return `<svg class="nl" viewBox="0 0 ${W} 160" role="img" aria-label="Bande numérique">${g}</svg>`;
  }

  function explainHTML(q, i) {
    if (!(q.op === "add" || q.op === "sub") || q.hole === 2) return "";
    const ex = buildExplanation(q);
    EXPL[i] = ex;
    return `<details class="explain" data-e="${i}">
      <summary>Voir l'explication</summary>
      <div class="explain-body">
        <p class="explain-intro">${ex.intro}</p>
        <div style="overflow-x:auto">${numberLine(ex)}</div>
        <ol class="steps">${ex.steps.map(t => `<li>${t}</li>`).join("")}</ol>
        <p class="explain-total">${ex.total}</p>
      </div>
    </details>`;
  }

  let playToken = 0;
  function stopExplain() {
    playToken++;
    try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
    document.querySelectorAll(".nl.playing").forEach(n => n.classList.remove("playing"));
    document.querySelectorAll(".steps li.on, .explain-total.on, .jump.on").forEach(n => n.classList.remove("on"));
  }
  function playExplain(i) {
    stopExplain();
    const token = playToken, ex = EXPL[i];
    const box = document.querySelector(`.explain[data-e="${i}"]`);
    const svg = box.querySelector(".nl"), lis = box.querySelectorAll(".steps li"), tot = box.querySelector(".explain-total");
    const parts = [{ t: ex.intro }, ...ex.steps.map((t, k) => ({ t, k })), { t: ex.total, total: true }];
    svg.classList.add("playing");
    const mark = (p) => {
      box.querySelectorAll(".on").forEach(n => n.classList.remove("on"));
      if (p.k !== undefined) { lis[p.k].classList.add("on"); svg.querySelector(`.jump[data-i="${p.k}"]`).classList.add("on"); }
      if (p.total) { tot.classList.add("on"); svg.classList.remove("playing"); }
    };
    const canSpeak = "speechSynthesis" in window;
    const voice = canSpeak ? speechSynthesis.getVoices().find(v => /^fr/i.test(v.lang)) : null;
    const run = (n) => {
      if (token !== playToken) return;
      if (n >= parts.length) { setTimeout(() => { if (token === playToken) stopExplain(); }, 2500); return; }
      mark(parts[n]);
      if (!canSpeak) { setTimeout(() => run(n + 1), 2800); return; }
      try {
        const u = new SpeechSynthesisUtterance(parts[n].t.replace(/−/g, " moins ").replace(/\?/g, " le nombre caché "));
        u.lang = "fr-FR"; u.rate = .92; if (voice) u.voice = voice;
        u.onend = () => setTimeout(() => run(n + 1), 250);
        u.onerror = () => setTimeout(() => run(n + 1), 2800);
        speechSynthesis.speak(u);
      } catch (e) { setTimeout(() => run(n + 1), 2800); }
    };
    run(0);
  }
  $("review-list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-listen]"); if (b) playExplain(Number(b.dataset.listen));
  });
  $("review-list").addEventListener("toggle", (e) => { if (!e.target.open) stopExplain(); }, true);

  /* ---------- feu d'artifice + confettis ---------- */
  let fxRaf = 0;
  function stopFx() {
    cancelAnimationFrame(fxRaf);
    const c = $("fx"); if (c) c.remove();
  }
  function celebrate() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.createElement("canvas"); cv.id = "fx"; document.body.appendChild(cv);
    const ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W, H;
    const resize = () => { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize(); addEventListener("resize", resize);
    const COLORS = ["#ff7a1a", "#ffd23f", "#2f80ed", "#8e44d6", "#e0442b", "#12a17a", "#ff5fa2"];
    const confetti = [], sparks = [], rockets = [];
    for (let i = 0; i < 160; i++) confetti.push({
      x: Math.random() * W, y: -20 - Math.random() * H, w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
      vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -.15 + Math.random() * .3,
      c: pick(COLORS),
    });
    const launch = () => rockets.push({ x: W * (.15 + Math.random() * .7), y: H, vy: -(H * .011 + Math.random() * 4), tx: H * (.15 + Math.random() * .3), c: pick(COLORS) });
    const explode = (x, y, c) => {
      const n = 60;
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n, s = 2 + Math.random() * 3.5;
        sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: Math.random() < .3 ? "#fff6c2" : c });
      }
    };
    const t0 = performance.now(); let lastLaunch = 0;
    const DURATION = 7000;
    function frame(t) {
      const el = t - t0;
      ctx.clearRect(0, 0, W, H);
      if (el < DURATION - 1500 && t - lastLaunch > 450) { launch(); if (Math.random() < .5) launch(); lastLaunch = t; }
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i]; r.y += r.vy; r.vy *= .985;
        ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, 7); ctx.fill();
        if (r.y <= r.tx || r.vy > -1.5) { explode(r.x, r.y, r.c); rockets.splice(i, 1); }
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i]; s.x += s.vx; s.y += s.vy; s.vy += .06; s.vx *= .985; s.life -= .014;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = s.life; ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = el > DURATION - 1200 ? Math.max(0, (DURATION - el) / 1200) : 1;
      for (const p of confetti) {
        p.y += p.vy; p.x += p.vx + Math.sin((p.y + p.r * 40) / 40) * .6; p.r += p.vr;
        if (p.y > H + 20 && el < DURATION - 2500) { p.y = -20; p.x = Math.random() * W; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.r)), p.w, p.h * Math.abs(Math.cos(p.r)) + 1);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      if (el < DURATION) fxRaf = requestAnimationFrame(frame);
      else { removeEventListener("resize", resize); cv.remove(); }
    }
    fxRaf = requestAnimationFrame(frame);
  }

  $("choices").addEventListener("click", (e) => { const b = e.target.closest(".choice"); if (b && !b.disabled) choose(Number(b.dataset.v)); });
  $("play").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("menu").addEventListener("click", () => { stopFx(); stopExplain(); show("home"); });
  $("quit").addEventListener("click", () => {
    clearTimeout(S.timer); stopClock(); S.locked = false;
    $("feedback").textContent = ""; $("feedback").className = "feedback";
    show("home");
  });
  document.addEventListener("keydown", (e) => {
    if ($("game").hidden || !/^[1-4]$/.test(e.key)) return;
    const b = $("choices").children[Number(e.key) - 1]; if (b && !b.disabled) b.click();
  });

  renderHome();
})();
</script>
</body>
</html>
